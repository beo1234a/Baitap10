<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 900px;
            max-width: 90%;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h1 {
            font-size: 36px;
            margin-bottom: 40px;
        }

        .profile {
            display: flex;
            align-items: flex-start;
            gap: 40px;
        }

        .avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #eee;
            background: #ddd;
        }

        .info {
            font-size: 20px;
            line-height: 2;
        }

        .info strong {
            display: inline-block;
            width: 130px;
        }

        .logout {
            margin-top: 35px;
            padding: 12px 30px;
            border: none;
            border-radius: 7px;
            background: #dc3545;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .logout:hover {
            background: #bb2d3b;
        }

        .error {
            color: red;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Spring Boot REST API with AJAX Example</h1>

    <div id="error" class="error"></div>

    <div class="profile">

        <!-- Ảnh đại diện -->
        <img id="userImage"
             class="avatar"
             alt="user image">

        <!-- Thông tin user -->
        <div class="info">

            <div>
                <strong>ID:</strong>
                <span id="userId"></span>
            </div>

            <div>
                <strong>Full Name:</strong>
                <span id="fullName"></span>
            </div>

            <div>
                <strong>Email:</strong>
                <span id="email"></span>
            </div>

            <div>
                <strong>Username:</strong>
                <span id="username"></span>
            </div>

            <div>
                <strong>Role:</strong>
                <span id="role"></span>
            </div>

        </div>

    </div>

    <button class="logout" onclick="logout()">
        Logout
    </button>

</div>


<script>

    // ==========================================
    // 1. Lấy JWT đã lưu lúc đăng nhập
    // ==========================================

    const token = localStorage.getItem("token");


    // ==========================================
    // 2. Nếu chưa đăng nhập -> quay về login
    // ==========================================

    if (!token) {
        window.location.href = "/login";
    }


    // ==========================================
    // 3. Tạo avatar mặc định
    // ==========================================

    function createDefaultAvatar(name) {

        const firstLetter =
            name && name.length > 0
                ? name.charAt(0).toUpperCase()
                : "U";

        const svg = `
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="160"
                 height="160"
                 viewBox="0 0 160 160">

                <rect width="160"
                      height="160"
                      fill="#6c757d"/>

                <circle cx="80"
                        cy="60"
                        r="30"
                        fill="white"/>

                <path d="M30 145
                         C30 105 55 90 80 90
                         C105 90 130 105 130 145"
                      fill="white"/>

            </svg>
        `;

        return "data:image/svg+xml;charset=UTF-8,"
            + encodeURIComponent(svg);
    }


    // ==========================================
    // 4. Gọi API /users/me
    // ==========================================

    fetch("/users/me", {

        method: "GET",

        headers: {
            "Authorization": "Bearer " + token
        }

    })

    .then(response => {

        // Nếu JWT hết hạn hoặc không hợp lệ
        if (!response.ok) {

            if (response.status === 401 ||
                response.status === 403) {

                localStorage.removeItem("token");

                window.location.href = "/login";

                return;
            }

            throw new Error(
                "Không thể lấy thông tin user"
            );
        }

        return response.json();
    })


    // ==========================================
    // 5. Nhận dữ liệu user
    // ==========================================

    .then(user => {

        console.log("User:", user);


        // ID
        document.getElementById("userId").textContent =
            user.id ?? "";


        // Họ tên
        document.getElementById("fullName").textContent =
            user.fullName ?? "";


        // Email
        document.getElementById("email").textContent =
            user.email ?? "";


        // Username
        document.getElementById("username").textContent =
            user.username ?? "";


        // Role
        document.getElementById("role").textContent =
            user.role ?? "";


        // ======================================
        // 6. Xử lý ảnh
        // ======================================

        const image =
            document.getElementById("userImage");


        if (user.images &&
            user.images.trim() !== "") {

            // Nếu database có ảnh
            image.src = user.images;

        } else {

            // Nếu database không có ảnh
            image.src =
                createDefaultAvatar(user.fullName);
        }


        // Nếu ảnh trong database bị lỗi
        image.onerror = function () {

            image.src =
                createDefaultAvatar(user.fullName);
        };

    })


    // ==========================================
    // 7. Nếu API lỗi
    // ==========================================

    .catch(error => {

        console.error(error);

        document.getElementById("error").textContent =
            "Không thể tải thông tin người dùng.";
    });


    // ==========================================
    // 8. Logout
    // ==========================================

    function logout() {

        localStorage.removeItem("token");

        window.location.href = "/login";
    }

</script>

</body>
</html>
